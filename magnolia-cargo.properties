# Magnolia Cargo Configuration
# =============================
# This file contains all configuration options for the Cargo utility scripts
# Environment variables can override these values (e.g., FLAGS_CLEAR_LOGS=true)

# Instance Configuration
# ----------------------
magnolia.instance.type=author
magnolia.instance.default=author

# Ports Configuration
# -------------------
# Author instance ports
author.port=8080
author.rmi.port=8206
author.shutdown.port=8005
author.ajp.port=8009

# Public/runtime instance ports
runtime.port=8081
runtime.rmi.port=8207
runtime.shutdown.port=8006
runtime.ajp.port=8010

# MailDev Configuration
# ---------------------
maildev.enabled=false
maildev.smtp.port=1025
maildev.ui.port=1080
maildev.url=http://localhost:1080

# Paths Configuration
# --------------------
# Relative to project root
paths.working.dir=magnolia/magnolia-webapp
paths.tomcat.base=tomcat
paths.logs.base=tomcat/logs
paths.repos.base=tomcat/Repos
paths.cargo.base=tomcat

# Author instance paths
author.repos.dir=tomcat/Repos/author
author.logs.dir=tomcat/logs/author
author.cargo.home=tomcat/cargo-author
author.context.path=/author
author.server.url=http://localhost:8080/author/

# Public/runtime instance paths
runtime.repos.dir=tomcat/Repos/public
runtime.logs.dir=tomcat/logs/public
runtime.cargo.home=tomcat/cargo-runtime
runtime.context.path=/
runtime.server.url=http://localhost:8081/

# Behavior Flags
# --------------
# Set to true/false
flags.clear.logs=true
flags.clear.jcr.locks=true
flags.open.browser=true
flags.force.restart=true
flags.verbose.debug=false
flags.quiet.heartbeat=true
flags.show.toasts=true

# startx Extension Hooks
# ----------------------
# Optional commands run by ./mgnl startx.
# Long-running startup commands are tracked and stopped automatically during startx shutdown.
startx.additional.script=
startx.additional-shutdown.script=
startx.additional.cwd=.
# Optional JSON descriptor for companion services. Leave blank to disable.
# See utils/mgnl/startx.services.example.json for the descriptor format.
startx.services.file=

# Intervals (in milliseconds)
# ---------------------------
intervals.poll=1000
intervals.heartbeat=30000
intervals.startup.timeout=1800000

# Maven Configuration
# -------------------
maven.command=mvn
maven.profile.author=author
maven.profile.runtime=runtime

# Logging Configuration
# ---------------------
log.file.name=tomcat.log
# Pattern to detect Tomcat server startup completion
# Must match the exact Tomcat startup message - very specific to avoid false positives
# This pattern matches: "Server startup in [12345] milliseconds" (exact format from Tomcat)
log.startup.pattern=Server startup in \\[\\d+\\] milliseconds

# PID Files
# ---------
pid.file.author=.cargo.author.pid
pid.file.runtime=.cargo.runtime.pid
pid.file.maildev=.maildev.pid
pid.file.startx.additional=.startx.additional.pid
pid.file.startx.services=.startx.services.json
pid.file.location=utils/exec

# Notification Configuration
# --------------------------
notification.title.prefix=🚀
notification.app.id=Magnolia Server Loader
notification.timeout=30
notification.sound=true
notification.wait=true

# Magnolia Enterprise License Configuration
# -----------------------------------------
# These properties are used to bootstrap the Enterprise license via injection
# Leave empty if you don't need license injection (e.g., using license file instead)
magnolia.license.owner=abennett@tbscg.com
magnolia.license.

# Magnolia Superuser Bootstrap Configuration
# ------------------------------------------
# Applied only when a repository is initialized for the first time.
magnolia.superuser.bootstrap.password=superuser


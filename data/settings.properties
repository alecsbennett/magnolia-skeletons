# Workspace inclusion patterns (comma-separated regex)
# Default: .* (all workspaces)
include=website

# Path exclusion patterns (comma-separated regex)
# Default patterns exclude system nodes and version history
# You can add custom patterns separated by commas
exclude=jcr:system.*,.*/jcr:versionStorage.*,.*/jcr:baseVersion.*,.*/jcr:predecessors.*,.*/jcr:successors.*

# Workspace-specific configuration
# Format: workspace.{workspaceName}.rootPath=/path/to/sync
#         workspace.{workspaceName}.fileNodeTypes=nodeType1,nodeType2
#         workspace.{workspaceName}.folderNodeTypes=nodeType1,nodeType2 (optional)

# Website workspace: sync pages from root, where mgnl:page nodes become XML files
workspace.website.rootPath=/
workspace.website.fileNodeTypes=mgnl:page

# Data directory where XML files will be stored
# Relative to project root or absolute path
data.dir=data

# Enable/disable synchronization
sync.enabled=true

# Perform initial sync on module startup
sync.initial=true

# Debug logging (set to true for verbose logging)
sync.debug=true

# Property prefixes to exclude from XML export (comma-separated)
# Properties starting with these prefixes will be excluded from exported XML files
# jcr:primaryType is always kept as it's required
# Default: mgnl:,jcr:
exclude.property.prefixes=mgnl:,jcr:
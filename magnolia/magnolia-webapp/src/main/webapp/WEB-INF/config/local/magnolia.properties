#--------------------------------------------
# Local Development Profile
# This profile is used for normal local development
#--------------------------------------------

# Development mode - enables development features
magnolia.develop=true

# Enable superuser for local development
magnolia.superuser.enabled=true

# Activate UTF-8 support to pages
magnolia.utf8.enabled=true

# Set it to true if bootstrapping/update should be performed automatically
magnolia.update.auto=true

# This is only used for the initial installation afterward the configuration in the config repository is used
magnolia.bootstrap.authorInstance=true

# Some modules contain optional sample content. They will check this property to decide if they should install
# the sample data
magnolia.bootstrap.samples=true

# Webapp name displayed in admin
magnolia.webapp=Local Author

# Jackrabbit indexing optimization
magnolia.repositories.jackrabbit.indexing.optimization=true

# Point to light-modules directory at project root
# From magnolia.home (tomcat/cargo-author/webapps/author) go up 4 levels to project root
magnolia.resources.dir=${magnolia.home}/../../../../light-modules
# Repository home should be in tomcat/Repos/author (not under webapps)
# From magnolia.home (tomcat/cargo-author/webapps/author) go up 3 levels to tomcat, then Repos/author
magnolia.repositories.home=${magnolia.home}/../../../Repos/author
magnolia.logs.dir=${magnolia.home}/logs

# JCR Filesystem Sync - enabled for local development
# This allows syncing JCR content to filesystem for local development
jcr.filesystem.sync.enabled=true

magnolia.bundle.version=6.4.0-rc3
